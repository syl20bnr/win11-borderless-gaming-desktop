[package]
name = "win11-borderless-gaming-desktop"
version = "2.2.0"
edition = "2024"
rust-version = "1.94"
description = "A tiny Windows utility to toggle taskbar auto-hide, desktop icons, desktop background and opened windows for borderless gaming."
categories = ["os::windows-apis"]
keywords = ["windows", "taskbar", "desktop", "gaming", "autohide"]
license = "GPL-3.0-or-later"
readme = "../../README.md"
repository = "https://github.com/syl20bnr/win11-borderless-gaming-desktop"
homepage = "https://github.com/syl20bnr/win11-borderless-gaming-desktop"
include = [
    "src/**",
    "assets/app.ico",
    "assets/runtime/**",
    "assets/README.md",
    "build.rs",
    "../../README.md",
    "../../LICENSE*",
    "Cargo.toml",
]

[features]
default = [
    "desktop-icons",
    "desktop-background",
    "minimize-all-windows",
    "gui",
    "sound",
]
desktop-icons = []
desktop-background = []
minimize-all-windows = []
gui = [
    "dep:eframe",
    "dep:epaint_default_fonts",
    "dep:image",
    "dep:raw-window-handle",
    "dep:serde",
    "dep:tray-icon",
    "windows/Win32_Devices_Display",
    "windows/Win32_Graphics_Gdi",
    "windows/Win32_System_Registry",
]
sound = ["gui", "windows/Win32_Media_Audio"]

[dependencies]
eframe = { version = "0.35.0", optional = true, default-features = false, features = [
    "glow",
    "persistence",
] }
epaint_default_fonts = { version = "0.35.0", optional = true }
image = { version = "0.25.10", optional = true, default-features = false, features = [
    "png",
] }
raw-window-handle = { version = "0.6.2", optional = true }
serde = { version = "1.0.228", optional = true, features = ["derive"] }
tray-icon = { version = "0.23.1", optional = true, default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1.12"
